services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: navalha
      POSTGRES_USER: navalha
      POSTGRES_PASSWORD: navalha_dev
    ports:
      - "5432:5432"
    volumes:
      - navalha_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navalha -d navalha"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  navalha_postgres:
